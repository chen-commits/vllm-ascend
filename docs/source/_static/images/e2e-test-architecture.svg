<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1160" viewBox="0 0 1500 1160" role="img" aria-labelledby="title desc">
  <title id="title">vLLM Ascend E2E 测试架构分层</title>
  <desc id="desc">展示调度定义、资源编排、测试资产、测试执行、结果诊断五层，以及 test、size 和 dp_load_balancing 参数的职责。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #475569; }
      .layer-title { font: 700 18px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .box-title { font: 700 17px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .box-text { font: 400 14px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 600 13px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #475569; }
      .edge { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .card { stroke-width: 1.5; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1500" height="1160" fill="#f8fafc"/>
  <text x="750" y="42" text-anchor="middle" class="title">vLLM Ascend E2E 测试架构分层</text>
  <text x="750" y="68" text-anchor="middle" class="subtitle">目录描述“测试什么”，CI 描述“何时运行、使用多少资源以及采用哪种运行模式”</text>

  <!-- Layer 1 -->
  <rect x="28" y="90" width="1444" height="155" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="52" y="120" class="layer-title">① 调度定义层</text>
  <text x="52" y="143" class="small">何时运行、选择哪个测试场景</text>

  <rect class="card" x="245" y="118" width="230" height="88" rx="13" fill="#ffffff" stroke="#60a5fa"/>
  <text x="360" y="150" text-anchor="middle" class="box-title">nightly_config.yaml</text>
  <text x="360" y="177" text-anchor="middle" class="box-text">每日调度用例集合</text>

  <rect class="card" x="505" y="118" width="230" height="88" rx="13" fill="#ffffff" stroke="#60a5fa"/>
  <text x="620" y="150" text-anchor="middle" class="box-title">weekly_config.yaml</text>
  <text x="620" y="177" text-anchor="middle" class="box-text">每周调度用例集合</text>

  <rect class="card" x="825" y="108" width="520" height="108" rx="13" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="1085" y="139" text-anchor="middle" class="box-title">用例条目</text>
  <text x="1085" y="166" text-anchor="middle" class="box-text">name · tests · size · dp_load_balancing</text>
  <text x="1085" y="190" text-anchor="middle" class="box-text">硬件、镜像及模型参数</text>

  <path class="edge" d="M475 162 H815"/>
  <path class="edge" d="M735 178 H815"/>

  <!-- Layer 2 -->
  <rect x="28" y="265" width="1444" height="175" rx="18" fill="#ecfdf5" stroke="#86efac"/>
  <text x="52" y="295" class="layer-title">② 资源编排层</text>
  <text x="52" y="318" class="small">在哪里运行、申请多少节点</text>

  <rect class="card" x="205" y="315" width="205" height="75" rx="13" fill="#ffffff" stroke="#4ade80"/>
  <text x="307" y="347" text-anchor="middle" class="box-title">single_node</text>
  <text x="307" y="372" text-anchor="middle" class="box-text">单节点任务</text>

  <rect class="card" x="435" y="315" width="205" height="75" rx="13" fill="#ffffff" stroke="#4ade80"/>
  <text x="537" y="347" text-anchor="middle" class="box-title">double_node</text>
  <text x="537" y="372" text-anchor="middle" class="box-text">固定双节点任务</text>

  <rect class="card" x="665" y="315" width="205" height="75" rx="13" fill="#ffffff" stroke="#4ade80"/>
  <text x="767" y="347" text-anchor="middle" class="box-title">multi_node</text>
  <text x="767" y="372" text-anchor="middle" class="box-text">size 指定节点数</text>

  <rect class="card" x="965" y="302" width="370" height="102" rx="13" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1150" y="334" text-anchor="middle" class="box-title">CI / 集群编排</text>
  <text x="1150" y="360" text-anchor="middle" class="box-text">Schedule workflow · Reusable workflow</text>
  <text x="1150" y="383" text-anchor="middle" class="box-text">Runner 或 LeaderWorkerSet</text>

  <path class="edge" d="M410 352 H945"/>
  <path class="edge" d="M640 365 H945"/>
  <path class="edge" d="M870 378 H945"/>
  <path class="edge-dashed" d="M1085 216 V250 H537 V305"/>
  <text x="806" y="243" text-anchor="middle" class="small">外层分组、size、硬件参数</text>

  <!-- Layer 3 -->
  <rect x="28" y="460" width="1444" height="175" rx="18" fill="#fff7ed" stroke="#fdba74"/>
  <text x="52" y="490" class="layer-title">③ 测试资产层</text>
  <text x="52" y="513" class="small">测试什么、使用哪一种公共运行实现</text>

  <rect class="card" x="210" y="510" width="490" height="88" rx="13" fill="#ffffff" stroke="#fb923c"/>
  <text x="455" y="542" text-anchor="middle" class="box-title">pytest 测试</text>
  <text x="455" y="570" text-anchor="middle" class="box-text">periodic/models · features · ops</text>

  <rect class="card" x="790" y="500" width="555" height="108" rx="13" fill="#ffedd5" stroke="#f97316"/>
  <text x="1067" y="532" text-anchor="middle" class="box-title">公共 Data Parallel Runtime</text>
  <text x="1067" y="559" text-anchor="middle" class="box-text">Internal LB · External LB（Hybrid LB 未来扩展）</text>
  <text x="1067" y="583" text-anchor="middle" class="box-text">rank、proxy、健康检查与清理</text>

  <path class="edge-dashed" d="M980 216 V445 H455 V500"/>
  <text x="557" y="452" class="small">test 选择 pytest</text>
  <path class="edge-dashed" d="M1190 216 V490"/>
  <text x="1202" y="449" class="small">dp_load_balancing</text>

  <!-- Layer 4 -->
  <rect x="28" y="655" width="1444" height="180" rx="18" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="52" y="685" class="layer-title">④ 测试执行层</text>
  <text x="52" y="708" class="small">在已创建的节点上启动服务并执行断言</text>

  <rect class="card" x="165" y="720" width="245" height="72" rx="13" fill="#ffffff" stroke="#c084fc"/>
  <text x="287" y="751" text-anchor="middle" class="box-title">各节点 pytest</text>
  <text x="287" y="776" text-anchor="middle" class="box-text">同一测试与运行参数</text>

  <rect class="card" x="475" y="720" width="245" height="72" rx="13" fill="#ffffff" stroke="#c084fc"/>
  <text x="597" y="751" text-anchor="middle" class="box-title">fixture</text>
  <text x="597" y="776" text-anchor="middle" class="box-text">选择 DP runtime</text>

  <rect class="card" x="785" y="710" width="260" height="92" rx="13" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="915" y="743" text-anchor="middle" class="box-title">vLLM 服务</text>
  <text x="915" y="770" text-anchor="middle" class="box-text">rank · proxy · API endpoint</text>

  <rect class="card" x="1110" y="720" width="245" height="72" rx="13" fill="#ffffff" stroke="#c084fc"/>
  <text x="1232" y="751" text-anchor="middle" class="box-title">测试断言</text>
  <text x="1232" y="776" text-anchor="middle" class="box-text">精度 · 性能 · 特性</text>

  <path class="edge" d="M410 756 H465"/>
  <path class="edge" d="M720 756 H775"/>
  <path class="edge" d="M1045 756 H1100"/>
  <path class="edge-dashed" d="M1150 404 V650 H287 V710"/>
  <text x="865" y="645" text-anchor="middle" class="small">创建节点和执行环境</text>
  <path class="edge-dashed" d="M455 598 V705 H287"/>
  <path class="edge-dashed" d="M1067 608 V690 H597 V710"/>

  <!-- Layer 5 -->
  <rect x="28" y="855" width="1444" height="245" rx="18" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="52" y="885" class="layer-title">⑤ 结果与诊断层</text>
  <text x="52" y="908" class="small">记录最近成功版本，在失败时定位引入问题的提交</text>

  <rect class="card" x="165" y="940" width="260" height="82" rx="13" fill="#ffffff" stroke="#94a3b8"/>
  <text x="295" y="972" text-anchor="middle" class="box-title">测试结果与日志</text>
  <text x="295" y="998" text-anchor="middle" class="box-text">PASS / FAIL / SKIP</text>

  <rect class="card" x="520" y="925" width="285" height="110" rx="13" fill="#dcfce7" stroke="#22c55e"/>
  <text x="662" y="960" text-anchor="middle" class="box-title">Good table</text>
  <text x="662" y="988" text-anchor="middle" class="box-text">成功时记录最近成功 commit</text>
  <text x="662" y="1012" text-anchor="middle" class="box-text">nightly / weekly 分开保存</text>

  <rect class="card" x="900" y="925" width="285" height="110" rx="13" fill="#fee2e2" stroke="#ef4444"/>
  <text x="1042" y="960" text-anchor="middle" class="box-title">Bisect</text>
  <text x="1042" y="988" text-anchor="middle" class="box-text">失败时二分提交历史</text>
  <text x="1042" y="1012" text-anchor="middle" class="box-text">定位首个失败 commit / PR</text>

  <rect class="card" x="1245" y="940" width="180" height="82" rx="13" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1335" y="972" text-anchor="middle" class="box-title">诊断报告</text>
  <text x="1335" y="998" text-anchor="middle" class="box-text">日志与提交范围</text>

  <path class="edge" d="M1232 792 V875 H295 V930"/>
  <path class="edge" d="M425 968 H510"/>
  <text x="466" y="955" text-anchor="middle" class="small">成功</text>
  <path class="edge" d="M425 998 H890"/>
  <text x="842" y="1018" text-anchor="middle" class="small">失败</text>
  <path class="edge" d="M805 950 H890"/>
  <text x="848" y="938" text-anchor="middle" class="small">last good</text>
  <path class="edge" d="M1185 980 H1235"/>

  <text x="750" y="1134" text-anchor="middle" class="subtitle">关键原则：测试目录不编码调度周期、节点数量或 DP 负载均衡模式</text>
</svg>
