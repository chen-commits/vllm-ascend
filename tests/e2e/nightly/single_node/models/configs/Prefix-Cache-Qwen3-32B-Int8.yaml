# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "prefix-cache-qwen3-32b-w8a8"
    model: "vllm-ascend/Qwen3-32B-W8A8"
    envs:
      TASK_QUEUE_ENABLE: "1"
      HCCL_OP_EXPANSION_MODE: "AIV"
      SERVER_PORT: "DEFAULT_PORT"
    server_cmd:
      - "--quantization"
      - "ascend"
      - "--reasoning-parser"
      - "qwen3"
      - "--tensor-parallel-size"
      - "4"
      - "--port"
      - "$SERVER_PORT"
      - "--max-model-len"
      - "8192"
      - "--max-num-batched-tokens"
      - "8192"
      - "--max-num-seqs"
      - "256"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--additional-config"
      - '{"enable_weight_nz_layout": true}'
    test_content:
      - "benchmark_comparisons"
    benchmark_comparisons_args:
      - metric: "TTFT"
        baseline: "prefix0"
        target: "prefix75"
        ratio: 0.4
        operator: "<"
    benchmarks:
      warm_up:
        case_type: performance
        dataset_generator:
          type: fixed
          input_len: 1024
          num_samples: 210
          seed: 42
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 210
        max_out_len: 1
        batch_size: 1000
        baseline: 0
        threshold: 0.97
      prefix0:
        case_type: performance
        dataset_generator:
          type: fixed
          input_len: 3500
          num_samples: 210
          seed: 42
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 210
        max_out_len: 1
        batch_size: 48
        baseline: 1
        threshold: 0.97
      prefix75:
        case_type: performance
        dataset_generator:
          type: prefix
          input_len: 3500
          num_samples: 210
          prefix_ratio: 0.75
          prefix_num: 1
          seed: 42
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 210
        max_out_len: 1
        batch_size: 48
        baseline: 1
        threshold: 0.97
